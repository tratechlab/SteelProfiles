<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />
  <rect width="512" height="512" rx="96" fill="url(#grid)" />
  <rect width="504" height="504" x="4" y="4" rx="92" stroke="#334155" stroke-width="2" fill="none" opacity="0.6"/>
  
  <!-- Engineering Guide Lines -->
  <line x1="96" y1="96" x2="416" y2="96" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="96" y1="416" x2="416" y2="416" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
  
  <!-- Steel I-Beam Silhouette -->
  <!-- Top flange: 120 wide, y: 120 to 170. Web: 236 to 276. Bottom flange: y: 342 to 392 -->
  <path d="
    M 120 120 
    H 392 
    V 172 
    H 282 
    Q 276 172 276 178 
    V 334 
    Q 276 340 282 340 
    H 392 
    V 392 
    H 120 
    V 340 
    H 230 
    Q 236 340 236 334 
    V 178 
    Q 236 172 230 172 
    H 120 
    Z
  " fill="url(#steel)" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Inner Highlight -->
  <path d="
    M 132 132 
    H 380 
    V 160 
    H 270 
    V 352 
    H 380 
    V 380 
    H 132 
    V 352 
    H 242 
    V 160 
    H 132 
    Z
  " fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Dimension indicators -->
  <circle cx="256" cy="256" r="6" fill="#38bdf8" />
  <circle cx="256" cy="256" r="14" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
</svg>
